    </g>
    <g>
      <rect x="-80" y="-118" width="160" height="236" rx="14" fill="#f4f1e8" stroke="#ecebe6" stroke-width="4"/>
      <path transform="translate(-52 -46) scale(2)" d="M0 16 C0 6 6 0 13 0 c6 0 10 4 13 9 c3-5 7-9 13-9 c7 0 13 6 13 16 c0 14-20 24-26 32 C20 40 0 30 0 16z" fill="#c2544f"/>
