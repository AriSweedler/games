<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Hearts">
  <!-- The link-preview card (docs/design/link-previews.md §2), in Hearts's quiet theme (theme.css): the
       shared dark felt, the word Hearts, the one accent as a rule under it, and a fan of three plain
       cards on the right, two hearts and the queen of spades, one pip each (AGENT.md "Theme: subtle, not gaudy": one accent, the suit, the name). tools/splash.ts
       renders it to web/public/games/hearts/splash.png. -->
  <defs>
    <radialGradient id="felt" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#1f5a3a"/>
      <stop offset="0.55" stop-color="#123a26"/>
      <stop offset="1" stop-color="#0b2418"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#felt)"/>
  <text x="96" y="300" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="160" fill="#ecebe6">Hearts</text>
  <rect x="100" y="334" width="130" height="4" fill="#c2544f"/>
  <text x="100" y="396" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#9a9891">Take the fewest points. Or take them all.</text>
  <g transform="translate(940 318)">
    <g transform="rotate(-16) translate(-82 14)">
