  <line x1="31" y1="58" x2="69" y2="58"/>
  <line x1="50" y1="84" x2="50" y2="89"/>
  <!-- right legs, front to back -->
  <polyline points="60,36 72,18 86,10"/>
  <polyline points="60,37 80,26 92,34"/>
  <polyline points="60,39 80,44 91,58"/>
  <polyline points="60,40 76,58 86,78"/>
  <!-- left legs, front to back -->
  <polyline points="40,36 28,18 14,10"/>
  <polyline points="40,37 20,26 8,34"/>
  <polyline points="40,39 20,44 9,58"/>
  <polyline points="40,40 24,58 14,78"/>
</svg>
