<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="UNO">
  <!-- The link-preview card (docs/design/link-previews.md §2), in UNO's theme (theme.css): a dark
       felt, the word UNO, and four plain card tiles in the deck's four colours (the theme's uno red,
       yellow, green and blue) fanned on the right. tools/splash.ts renders it to web/public/games/uno/splash.png. -->
  <defs>
    <radialGradient id="felt" cx="0.62" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#1f3a2c"/>
      <stop offset="1" stop-color="#121418"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#felt)"/>
  <text x="96" y="300" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="168" letter-spacing="6" fill="#ecebe6">UNO</text>
  <rect x="100" y="334" width="130" height="4" fill="#c2d06d"/>
  <text x="100" y="396" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#9a9891">Match the colour or the number.</text>
  <g transform="translate(930 320)">
    <g transform="rotate(-21) translate(-96 18)">
      <rect x="-70" y="-105" width="140" height="210" rx="14" fill="#d64541" stroke="#ecebe6" stroke-width="6"/>
    </g>
    <g transform="rotate(-7) translate(-32 2)">
      <rect x="-70" y="-105" width="140" height="210" rx="14" fill="#e8c547" stroke="#ecebe6" stroke-width="6"/>
    </g>
    <g transform="rotate(7) translate(32 2)">
      <rect x="-70" y="-105" width="140" height="210" rx="14" fill="#3fa66b" stroke="#ecebe6" stroke-width="6"/>
    </g>
    <g transform="rotate(21) translate(96 18)">
      <rect x="-70" y="-105" width="140" height="210" rx="14" fill="#3b7dd8" stroke="#ecebe6" stroke-width="6"/>
      <ellipse cx="0" cy="0" rx="44" ry="70" transform="rotate(28)" fill="none" stroke="#ecebe6" stroke-opacity="0.85" stroke-width="5"/>
    </g>
  </g>
  <text x="98" y="580" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#ecebe6" fill-opacity="0.7" letter-spacing="1">games.sweedler.com</text>
</svg>
